services:
  mysql:
    image: mysql:8.4
    container_name: jcsmart-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jc_smart_ride
      MYSQL_USER: jcsmart
      MYSQL_PASSWORD: jcsmart
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - jcsmart_mysql:/var/lib/mysql

volumes:
  jcsmart_mysql:
